services:
  - type: web
    name: ai-interview-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: rule-based
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ai_interview_system
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://vikas-dr.github.io,https://Vikas-Dr.github.io
      - key: PYTHON_VERSION
        value: "3.11.4"
