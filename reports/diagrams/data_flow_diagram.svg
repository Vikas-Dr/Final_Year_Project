<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="700" y="50" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700" fill="#0f172a">Data Flow Diagram</text>
  <rect x="120" y="220" width="180" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="275" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Candidate</text>
  <text x="210" y="305" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Input</text>
  <rect x="430" y="150" width="220" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="200" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Resume</text>
  <text x="540" y="230" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Upload</text>
  <rect x="430" y="360" width="220" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="540" y="410" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Identity</text>
  <text x="540" y="440" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Verification</text>
  <rect x="760" y="250" width="250" height="120" rx="18" fill="#e9d5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="885" y="300" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Processing</text>
  <text x="885" y="332" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Engine</text>
  <rect x="1080" y="250" width="170" height="120" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1165" y="300" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Output</text>
  <text x="1165" y="332" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Report</text>
  <line x1="300" y1="280" x2="430" y2="205" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="300" y1="280" x2="430" y2="415" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="650" y1="205" x2="760" y2="280" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="650" y1="415" x2="760" y2="345" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1010" y1="315" x2="1080" y2="315" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="240" font-size="18" font-family="Arial" fill="#334155">Resume</text>
  <text x="350" y="390" font-size="18" font-family="Arial" fill="#334155">ID + selfie</text>
  <text x="695" y="250" font-size="18" font-family="Arial" fill="#334155">Skill extraction</text>
  <text x="705" y="430" font-size="18" font-family="Arial" fill="#334155">Match check</text>
  <text x="1025" y="290" font-size="18" font-family="Arial" fill="#334155">Score</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
